<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Bruno Ghiggi — encontre suas fotos.">
<meta name="theme-color" content="#0d0d0d">
<title>Bruno Ghiggi | Encontre suas fotos</title>
<style>
:root{--y:#ffd000;--b:#0d0d0d}
*{box-sizing:border-box}
body{margin:0;background:var(--b);color:#fff;font-family:Arial,Helvetica,sans-serif}
.hero{min-height:100vh;display:flex;align-items:center;padding:28px 20px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 50%,#ffd00016,transparent 30%),linear-gradient(110deg,#0d0d0d 25%,#0d0d0dcc 58%,#0d0d0d 100%);z-index:0}
.wrap{width:min(900px,100%);margin:auto;display:grid;grid-template-columns:30% 70%;align-items:center;gap:38px;position:relative;z-index:1}
.photo{width:min(245px,100%);aspect-ratio:1;border-radius:50%;overflow:hidden;border:2px solid var(--y);box-shadow:0 0 0 8px #ffd00010,0 20px 55px #000;justify-self:center}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.brand{width:100%}
h1{font-size:clamp(38px,6vw,62px);line-height:.9;letter-spacing:-2px;margin:0 0 28px;font-weight:900}
h1 span{color:var(--y)}
.links{display:grid;gap:14px;max-width:620px}
.link{display:flex;align-items:center;justify-content:space-between;min-height:88px;padding:13px 18px;color:#fff;text-decoration:none;border:1px solid #ffffff55;border-radius:17px;background:#ffffff0b;backdrop-filter:blur(8px);transition:.18s;box-shadow:0 8px 28px #0005}
.link:hover{transform:translateY(-3px);border-color:var(--y);background:#ffffff12}
.left{display:flex;align-items:center;gap:18px}
.logo-box{height:55px;width:150px;display:flex;align-items:center;justify-content:flex-start;background:transparent;flex-shrink:0}
.logo-box.fotto{background:#fff;border-radius:10px;padding:8px 12px}
.logo-box.foco{width:175px;padding:4px 0}
.logo-box img{max-width:100%;max-height:100%;display:block;object-fit:contain}
.title{font-size:19px;font-weight:900}.sub{font-size:12px;color:#aaa;margin-top:4px}
.arrow{width:42px;height:42px;border-radius:50%;background:var(--y);color:#111;display:grid;place-items:center;font-size:25px;font-weight:900;flex-shrink:0}
.whatsapp-icon{width:55px;height:55px;border-radius:14px;background:#25d366;display:grid;place-items:center;font-size:28px;flex-shrink:0}
.bottom{position:absolute;left:0;right:0;bottom:16px;text-align:center;color:#555;font-size:10px;letter-spacing:2px}
@media(max-width:720px){
 .hero{padding:24px 16px 48px;align-items:center}
 .wrap{grid-template-columns:1fr;gap:25px;max-width:500px}
 .photo{width:180px}
 .brand{text-align:center}
 h1{font-size:40px;margin-bottom:25px}
 .links{text-align:left}
 .left{gap:12px}
 .logo-box{width:105px;height:48px}
 .logo-box.foco{width:120px}
 .title{font-size:17px}
 .sub{font-size:11px}
 .arrow{width:38px;height:38px}
 .bottom{display:none}
}
</style>
<script>
const GA_ID='G-XXXXXXXXXX';
if(GA_ID!=='G-XXXXXXXXXX'){
 const s=document.createElement('script');s.async=true;
 s.src='https://www.googletagmanager.com/gtag/js?id='+GA_ID;
 document.head.appendChild(s);
 window.dataLayer=window.dataLayer||[];
 function gtag(){dataLayer.push(arguments)}
 window.gtag=gtag;
 gtag('js',new Date());gtag('config',GA_ID,{anonymize_ip:true});
}
function track(platform,destination){
 if(typeof gtag==='function') gtag('event','click_fotos',{plataforma:platform,destino:destination});
}
</script>
</head>
<body>
<section class="hero">
<div class="wrap">
<div class="photo">
<img src="bruno.jpg" alt="Bruno Ghiggi com sua câmera">
</div>
<div class="brand">
<h1>Bruno <span>Ghiggi</span></h1>
<div class="links">
<a class="link" href="./fotto/" onclick="track('fotto','./fotto/')">
 <div class="left">
  <div class="logo-box fotto"><img src="https://cdn.fotto.com.br/_next/static/media/fotto-logo-isolated.e983b817.svg" alt="Fotto"></div>
  <div><div class="title">Fotto</div><div class="sub">Encontre suas fotos</div></div>
 </div><div class="arrow">›</div>
</a>
<a class="link" href="./foco/" onclick="track('foco_radical','./foco/')">
 <div class="left">
  <div class="logo-box foco"><img src="https://cdn.brandfetch.io/idMHRizKzt/w/851/h/197/theme/dark/logo.png?c=1bxid64Mup7aczewSAYMX&t=1791145879196" alt="Foco Radical"></div>
  <div><div class="title">Foco Radical</div><div class="sub">Encontre suas fotos</div></div>
 </div><div class="arrow">›</div>
</a>
<a class="link" href="./whatsapp/" onclick="track('whatsapp','./whatsapp/')">
 <div class="left">
  <div class="whatsapp-icon">☏</div>
  <div><div class="title">WhatsApp</div><div class="sub">Fale comigo</div></div>
 </div><div class="arrow">›</div>
</a>
</div>
</div>
</div>
<div class="bottom">BRUNO GHIGGI</div>
</section>
</body>
</html>
